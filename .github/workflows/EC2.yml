name: Entrega Continua

on:
  workflow_call:

jobs:

  docker:
    runs-on: ubuntu-latest
    steps:
    
    - uses: actions/checkout@v3

    - name: Download a Build Artifact
      uses: actions/download-artifact@v4.3.0
      with:
    # Name of the artifact to download. If unspecified, all artifacts for the run are downloaded.
        name: programa

    - name: Deploy to Staging server
      uses: easingthemes/ssh-deploy@main
      with:
        #Chave SSH criada ao instanciar uma máquina na EC2
        SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        #IP Público da instância EC2
        REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
        #Nome do usuário da instância EC2
        REMOTE_USER: ${{ secrets.REMOTE_USER }}
        TARGET: /home/${{ secrets.REMOTE_USER }}
        EXCLUDE: "postgres-data"

    - name: Execute remote SSH commands using password
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.REMOTE_HOST }}
        username: ${{ secrets.REMOTE_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: 22
        script: |
          export HOST=${{ secrets.DBHOST }}
          export USER=${{ secrets.DBUSER }} 
          export PASSWORD=${{ secrets.DBPASSWORD }}
          export DBNAME=${{ secrets.DBNAME }}
          export DBPORT=${{ secrets.DBPORT }}
          export PORT=8000
